<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 96 96">
    <!--
        Kernel's favicon is the site's own avatar, circle-cropped. It carries
        explicit colours rather than currentColor so the ring reads against
        both a light and a dark browser tab.
    -->
    <defs>
        <clipPath id="c"><circle cx="48" cy="48" r="46"/></clipPath>
    </defs>
    <circle cx="48" cy="48" r="48" fill="#f7f6f3"/>
    <image href="data:image/jpeg;base64," x="0" y="0" width="96" height="96" clip-path="url(#c)" preserveAspectRatio="xMidYMid slice"/>
    <circle cx="48" cy="48" r="47" fill="none" stroke="#16150f" stroke-opacity="0.14" stroke-width="2"/>
</svg>
