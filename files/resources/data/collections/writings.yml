# Column types for writings.json — the source of truth the builder reads:
# richtext columns open in the rich editor (the Content drawer and any
# section repeater listing this collection).
fields:
    title: { type: text }
    slug: { type: text }
    link: { type: url }
    description: { type: textarea }
    date: { type: text }
    dateFormatted: { type: text }
    year: { type: text }
    readTime: { type: text }
    dateline: { type: text }
    meta: { type: text }
    content: { type: richtext }
